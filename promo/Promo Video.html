<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Shoal · Promo video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app-styles.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="scenes-1-2.jsx"></script>
<script type="text/babel" src="scenes-3-4.jsx"></script>
<script type="text/babel" src="scenes-5-7.jsx"></script>

<script type="text/babel">
function Video() {
  // Scene timing (seconds)
  // 0:   Intro          0.0 - 4.0   (4s)
  // 1:   Dashboard      4.0 - 9.5   (5.5s)
  // 2:   Create Cluster 9.5 - 15.0  (5.5s)
  // 3:   Clusters list  15.0 - 19.0 (4s)
  // 4:   Terminal       19.0 - 26.5 (7.5s)
  // 5:   Plugins        26.5 - 32.0 (5.5s)
  // 6:   Outro          32.0 - 37.0 (5s)
  const TOTAL = 37;
  return (
    <Stage width={1920} height={1080} duration={TOTAL} background="#000">
      <IntroScene         start={0}    end={4.0}/>
      <DashboardScene     start={4.0}  end={9.5}/>
      <CreateClusterScene start={9.5}  end={15.0}/>
      <ClustersScene      start={15.0} end={19.0}/>
      <TerminalScene      start={19.0} end={26.5}/>
      <PluginsScene       start={26.5} end={32.0}/>
      <OutroScene         start={32.0} end={37.0}/>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Video/>);
</script>
</body>
</html>
