server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed bundles are immutable; HTML must revalidate.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # expo-router exports one HTML file per route without an extension
    # (/developers -> developers.html); unknown paths get the 404 page
    # with a real 404 status.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
