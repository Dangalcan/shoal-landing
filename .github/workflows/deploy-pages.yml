name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  # Allow manual deploys from the Actions tab as well.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        # Project sites are served from https://<user>.github.io/<repo>/,
        # so the bundle must be built with the repo name as base path.
        # Remove BASE_URL if this ever deploys to a custom domain or a
        # <user>.github.io root site.
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web

      - name: Add 404 fallback
        run: cp "dist/+not-found.html" dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
